<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#171c1a">
  <meta name="description" content="Operations console for a multi-agent business automation platform: workflows, human approvals, tools, retrieval, observability, and evaluation.">
  <link rel="preload" href="assets/fonts/manrope-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>BizOps Agent Console</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
          <defs><linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19a874"/><stop offset="1" stop-color="#0d6b63"/></linearGradient></defs>
          <rect width="36" height="36" rx="10" fill="url(#brand-grad)"/>
          <path d="M11 24.5l7-12.5 7 12.5" fill="none" stroke="#f6f4ef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="12" r="2.6" fill="#f6f4ef"/><circle cx="11" cy="24.5" r="2.6" fill="#f6f4ef"/><circle cx="25" cy="24.5" r="2.6" fill="#bff0da"/>
        </svg>
        <div><div class="brand-name">BizOps Agent</div><div class="brand-sub">Operations console</div></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 id="page-title" class="page-title">Overview</h1>
        <div class="topbar-right">
          <span id="mode-badge" class="badge"></span>
          <button class="icon-btn" id="refresh-btn" aria-label="Refresh data" title="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="theme-btn" aria-label="Switch colour theme" title="Theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>
      <div id="banner"></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This console needs JavaScript.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
